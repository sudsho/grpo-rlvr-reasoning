model:
  name: Qwen/Qwen2.5-Math-1.5B
  dtype: bfloat16
  trust_remote_code: true

rollout:
  engine: vllm
  max_new_tokens: 1024
  temperature: 1.0
  top_p: 0.95
  group_size: 8
  prompts_per_batch: 24
  seed: 4242

optim:
  lr: 8.0e-7
  kl_coef: 0.02
  epsilon_clip: 0.2
  warmup_steps: 20

train:
  domain: combined
  dataset: gsm8k_and_mbpp
  steps: 3000
  save_every: 300
  eval_every: 500
  log_every: 5
  out_dir: src/models/checkpoints/grpo_combined
  wandb_project: grpo-rlvr
  wandb_run_name: combined_v1
  reward_weights_correctness: 1.0
  reward_weights_format: 0.1
  reward_weights_length: 0.005
  reward_max_len_tokens: 1024
